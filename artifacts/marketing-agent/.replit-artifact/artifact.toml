kind = "web"
previewPath = "/"
title = "Agent Marketing IA"
version = "1.0.0"
id = "artifacts/marketing-agent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22821

[services.development]
run = "pnpm --filter @workspace/marketing-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketing-agent", "run", "build" ]
run = "pnpm --filter @workspace/marketing-agent run serve"

[services.env]
PORT = "22821"
BASE_PATH = "/"
